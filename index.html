<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Task Alarm Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: #1a1a1a;
            color: #f2f2f2;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        h1 {
            color: #4dff88;
            text-shadow: 2px 2px #000;
        }
        
        .task-form {
            background: #2b2b2b;
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            box-shadow: 0 0 15px #4dff8850;
        }
        
        .task-form input,
        .task-form textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            background: #1a1a1a;
            color: #f2f2f2;
            transition: 0.3s;
        }
        
        .task-form input:hover,
        .task-form textarea:hover,
        .task-form input:focus,
        .task-form textarea:focus {
            box-shadow: 0 0 10px #4dff88;
            outline: none;
        }
        
        .time-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            align-items: center;
        }
        
        .ampm-btn {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #4dff88;
            background: #1a1a1a;
            color: #4dff88;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .ampm-btn:hover {
            background: #4dff88;
            color: #1a1a1a;
            box-shadow: 0 0 10px #4dff88;
        }
        
        .task-form button {
            margin-top: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #4dff88;
            color: #1a1a1a;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .task-form button:hover {
            background: #38e573;
            box-shadow: 0 0 15px #4dff88;
        }
        
        .nav {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 14px 0;
        }
        
        .nav button {
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid #4dff88;
            background: none;
            color: #4dff88;
            cursor: pointer;
            font-weight: bold;
        }
        
        .nav button.active,
        .nav button:hover {
            background: #4dff88;
            color: #1a1a1a;
            box-shadow: 0 0 10px #4dff88;
        }
        
        .tasks {
            width: 100%;
            max-width: 600px;
        }
        
        .task {
            background: #2b2b2b;
            margin-bottom: 15px;
            padding: 15px;
            border-left: 5px solid #4dff88;
            border-radius: 5px;
            box-shadow: 0 0 10px #4dff8830;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .task h3 {
            margin: 0 0 5px 0;
            color: #80ffb3;
        }
        
        .delete-btn,
        .edit-btn {
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 5px;
            transition: 0.3s;
        }
        
        .delete-btn {
            background: #ff4d4d;
            color: #fff;
        }
        
        .delete-btn:hover {
            background: #ff1a1a;
            box-shadow: 0 0 10px #ff4d4d;
        }
        
        .edit-btn {
            background: #4da6ff;
            color: #fff;
        }
        
        .edit-btn:hover {
            background: #1a8cff;
            box-shadow: 0 0 10px #4da6ff;
        }
        
        #enableSoundBtn,
        #stopAlarmBtn,
        #clearHistoryBtn {
            margin: 14px 0;
            font-weight: bold;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #enableSoundBtn {
            background: #4dff88;
            color: #1a1a1a;
            box-shadow: 0 0 10px #4dff88;
        }
        
        #stopAlarmBtn {
            background: #ff4d4d;
            color: #fff;
            display: none;
            box-shadow: 0 0 10px #ff4d4d;
        }
        
        #clearHistoryBtn {
            background: #ff8800;
            color: #fff;
            box-shadow: 0 0 10px #ff8800;
            display: block;
            margin: 20px auto;
        }
        
        #clearHistoryBtn:hover {
            background: #ff6600;
            box-shadow: 0 0 15px #ff6600;
        }
        
        .banner {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            top: 12px;
            z-index: 99999;
            background: #4dff88;
            color: #001;
            padding: 10px 14px;
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        /* === Search in history === */
        
        .search-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .search-container input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #2b2b2b;
            color: #f2f2f2;
        }
        
        .search-container input:focus {
            outline: none;
            box-shadow: 0 0 10px #4dff88;
        }
    </style>
</head>

<body>
    <h1>⏰ Daily Task Alarm Tracker</h1>

    <div class="nav">
        <button id="todayBtn" class="active">🕒 Today's Tasks</button>
        <button id="historyBtn">📜 History</button>
    </div>

    <button id="enableSoundBtn">Enable Alarm Sound 🔊</button>

    <!-- Today Section -->
    <div id="todaySection">
        <div class="task-form">
            <h2>Add / Edit Task</h2>
            <input id="taskTitle" type="text" placeholder="Task Title">
            <textarea id="taskDesc" rows="3" placeholder="Task Description"></textarea>
            <input id="taskDate" type="date">
            <div class="time-container">
                <input id="taskTime" type="time">
                <button id="ampmBtn" class="ampm-btn">AM</button>
            </div>
            <button id="addUpdateBtn">Add Task</button>
        </div>

        <div class="tasks" id="tasks"></div>
        <button id="stopAlarmBtn">Stop Alarm 🔕</button>
    </div>

    <!-- History Section -->
    <div id="historySection" style="display:none; width:100%; max-width:600px; margin-top:10px;">
        <h2 style="text-align:center; color:#4dff88;">📜 History</h2>

        <!-- Search for history -->
        <div class="search-container">
            <input type="text" id="searchHistory" placeholder="🔍 Search by task name...">
            <input type="date" id="searchHistoryDate">
        </div>

        <div id="history" class="tasks"></div>
        <button id="clearHistoryBtn">🧹 Clear All History</button>
    </div>

    <audio id="alarmAudio" src="mixkit-vintage-warning-alarm-990.wav" loop></audio>
    <script>
        (() => {
            let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
            let history = JSON.parse(localStorage.getItem('history') || '[]');

            const tasksDiv = document.getElementById('tasks');
            const histDiv = document.getElementById('history');
            const searchHistory = document.getElementById('searchHistory');
            const searchHistoryDate = document.getElementById('searchHistoryDate');
            const clearHistoryBtn = document.getElementById('clearHistoryBtn');

            const enableSoundBtn = document.getElementById('enableSoundBtn');
            const stopAlarmBtn = document.getElementById('stopAlarmBtn');
            const alarmAudio = document.getElementById('alarmAudio');
            const ampmBtn = document.getElementById('ampmBtn');
            const addUpdateBtn = document.getElementById('addUpdateBtn');
            const todayBtn = document.getElementById('todayBtn');
            const historyBtn = document.getElementById('historyBtn');
            const todaySection = document.getElementById('todaySection');
            const historySection = document.getElementById('historySection');

            const inputTitle = document.getElementById('taskTitle');
            const inputDesc = document.getElementById('taskDesc');
            const inputDate = document.getElementById('taskDate');
            const inputTime = document.getElementById('taskTime');

            // ✅ Add this button below your "Enable Alarm Sound" in HTML:
            // <button id="downloadTasksBtn">💾 Download All Tasks</button>
            const downloadTasksBtn = document.createElement('button');
            downloadTasksBtn.id = 'downloadTasksBtn';
            downloadTasksBtn.textContent = '💾 Download All Tasks';
            downloadTasksBtn.style.marginTop = '10px';
            downloadTasksBtn.style.padding = '10px 20px';
            downloadTasksBtn.style.borderRadius = '5px';
            downloadTasksBtn.style.background = '#4da6ff';
            downloadTasksBtn.style.color = '#fff';
            downloadTasksBtn.style.fontWeight = 'bold';
            downloadTasksBtn.style.cursor = 'pointer';
            document.querySelector('.task-form').appendChild(downloadTasksBtn);

            let selectedAmPm = 'AM';
            let editingId = null;
            let ringingTaskId = null;
            const pad2 = n => String(n).padStart(2, '0');

            function save() {
                localStorage.setItem('tasks', JSON.stringify(tasks));
                localStorage.setItem('history', JSON.stringify(history));
            }

            enableSoundBtn.addEventListener('click', () => {
                alarmAudio.play().then(() => {
                    alarmAudio.pause();
                    alarmAudio.currentTime = 0;
                    enableSoundBtn.style.display = 'none';
                    alert('✅ Alarm sound enabled');
                }).catch(() => alert('⚠️ Click again to enable sound'));
            });

            ampmBtn.addEventListener('click', () => {
                selectedAmPm = selectedAmPm === 'AM' ? 'PM' : 'AM';
                ampmBtn.textContent = selectedAmPm;
            });

            todayBtn.addEventListener('click', () => {
                todayBtn.classList.add('active');
                historyBtn.classList.remove('active');
                todaySection.style.display = 'block';
                historySection.style.display = 'none';
                renderAll();
            });

            historyBtn.addEventListener('click', () => {
                historyBtn.classList.add('active');
                todayBtn.classList.remove('active');
                todaySection.style.display = 'none';
                historySection.style.display = 'block';
                renderAll();
            });

            function newId() {
                return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
            }

            function renderAll() {
                renderToday();
                renderHistory();
            }

            function renderToday() {
                tasksDiv.innerHTML = '';
                const nowLocal = localYYYYMMDDTHHMM(new Date());
                let upcoming = tasks.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
                upcoming = upcoming.filter(t => `${t.date}T${t.time}` >= nowLocal);

                if (upcoming.length === 0) {
                    tasksDiv.innerHTML = '<p style="text-align:center; opacity:0.7;">No tasks found</p>';
                    return;
                }

                upcoming.forEach(t => {
                    const el = document.createElement('div');
                    el.className = 'task';
                    el.innerHTML = `
        <div>
          <h3>${t.title}</h3>
          <p>${t.desc}</p>
          <p><b>${t.date}</b> @ ${t.time}</p>
        </div>
        <div>
          <button class="edit-btn" data-id="${t.id}">Edit</button>
          <button class="delete-btn" data-id="${t.id}">Delete</button>
        </div>`;
                    tasksDiv.appendChild(el);
                });

                tasksDiv.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.onclick = e => {
                        tasks = tasks.filter(x => x.id !== e.target.dataset.id);
                        save();
                        renderAll();
                    };
                });

                tasksDiv.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.onclick = e => startEdit(e.target.dataset.id);
                });
            }

            function renderHistory() {
                histDiv.innerHTML = '';
                let filtered = history.slice();
                if (searchHistory.value) {
                    filtered = filtered.filter(h => h.title.toLowerCase().includes(searchHistory.value.toLowerCase()));
                }
                if (searchHistoryDate.value) {
                    filtered = filtered.filter(h => h.date === searchHistoryDate.value);
                }

                if (filtered.length === 0) {
                    histDiv.innerHTML = '<p style="text-align:center; opacity:0.7;">No history found</p>';
                    return;
                }

                filtered.sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt));
                filtered.forEach(t => {
                    const el = document.createElement('div');
                    el.className = 'task';
                    el.innerHTML = `
        <div>
          <h3>${t.title}</h3>
          <p>${t.desc}</p>
          <p>✅ Completed at ${t.completedAt}</p>
        </div>
        <div>
          <button class="delete-btn" data-id="${t.id}">Remove</button>
        </div>`;
                    histDiv.appendChild(el);
                });

                histDiv.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.onclick = e => {
                        history = history.filter(x => x.id !== e.target.dataset.id);
                        save();
                        renderHistory();
                    };
                });
            }

            clearHistoryBtn.addEventListener('click', () => {
                if (history.length === 0) return alert('No history to clear!');
                if (confirm('🧹 Are you sure you want to clear all history?')) {
                    history = [];
                    save();
                    renderHistory();
                    alert('✅ History cleared!');
                }
            });

            addUpdateBtn.addEventListener('click', () => {
                const title = inputTitle.value.trim();
                const desc = inputDesc.value.trim();
                const date = inputDate.value;
                const timeVal = inputTime.value;
                if (!title || !desc || !date || !timeVal) return alert('⚠️ Please fill all fields');

                let [h, m] = timeVal.split(':').map(Number);
                if (selectedAmPm === 'PM' && h < 12) h += 12;
                if (selectedAmPm === 'AM' && h === 12) h = 0;
                const time24 = `${pad2(h)}:${pad2(m)}`;

                if (editingId) {
                    const idx = tasks.findIndex(x => x.id === editingId);
                    tasks[idx] = {...tasks[idx],
                        title,
                        desc,
                        date,
                        time: time24
                    };
                    editingId = null;
                    addUpdateBtn.textContent = 'Add Task';
                } else {
                    tasks.push({
                        id: newId(),
                        title,
                        desc,
                        date,
                        time: time24
                    });
                }
                save();
                clearForm();
                renderAll();
            });

            function startEdit(id) {
                const t = tasks.find(x => x.id === id);
                if (!t) return;
                editingId = id;
                inputTitle.value = t.title;
                inputDesc.value = t.desc;
                inputDate.value = t.date;
                inputTime.value = t.time;
                selectedAmPm = t.time >= '12:00' ? 'PM' : 'AM';
                ampmBtn.textContent = selectedAmPm;
                addUpdateBtn.textContent = 'Update Task';
            }

            function clearForm() {
                inputTitle.value = '';
                inputDesc.value = '';
                inputDate.value = '';
                inputTime.value = '';
                selectedAmPm = 'AM';
                ampmBtn.textContent = 'AM';
            }

            function localYYYYMMDDTHHMM(d) {
                return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
            }

            function checkAlarms() {
                const nowLocal = localYYYYMMDDTHHMM(new Date());
                tasks.forEach(t => {
                    if (!t.triggered && `${t.date}T${t.time}` === nowLocal) {
                        t.triggered = true;
                        save();
                        startRinging(t.id);
                    }
                });
            }

            function startRinging(id) {
                const t = tasks.find(x => x.id === id);
                if (!t) return;
                ringingTaskId = id;
                showBanner(`⏰ ${t.title} — ${t.time}`);
                alarmAudio.currentTime = 0;
                alarmAudio.play().catch(() => {});
                stopAlarmBtn.style.display = 'inline-block';
            }

            stopAlarmBtn.addEventListener('click', stopAlarm);

            function stopAlarm() {
                alarmAudio.pause();
                alarmAudio.currentTime = 0;
                stopAlarmBtn.style.display = 'none';
                if (ringingTaskId) {
                    const idx = tasks.findIndex(x => x.id === ringingTaskId);
                    if (idx !== -1) {
                        const done = {...tasks[idx],
                            completedAt: new Date().toLocaleString()
                        };
                        history.unshift(done);
                        tasks.splice(idx, 1);
                        save();
                        renderAll();
                    }
                    ringingTaskId = null;
                }
            }

            function showBanner(msg) {
                const el = document.createElement('div');
                el.className = 'banner';
                el.textContent = msg;
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 5000);
            }

            // 💾 Download button logic
            downloadTasksBtn.addEventListener('click', () => {
                const allData = {
                    tasks,
                    history,
                    exportedAt: new Date().toLocaleString()
                };
                const blob = new Blob([JSON.stringify(allData, null, 2)], {
                    type: 'application/json'
                });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `task_backup_${Date.now()}.json`;
                a.click();
                showBanner('💾 Tasks downloaded successfully!');
            });

            searchHistory.addEventListener('input', renderHistory);
            searchHistoryDate.addEventListener('input', renderHistory);

            renderAll();
            setInterval(checkAlarms, 1000);
        })();
    </script>

</body>

</html>
